# Netlify configuration for the web app.
#
# Netlify looks for config in package directory → base directory → repo root.
# In the Netlify UI, leave the base directory blank (the repo root) and set the
# package directory to `apps/web`, so that installs run at the workspace root
# where pnpm can link the `workspace:*` dependency on @moviewatchlist/shared.
# Pointing the base directory here instead would install inside the app, and
# that dependency would fail to resolve.
#
# `publish` must point at the Next.js build output. Left unset it defaults to
# the package directory itself, and the Next Runtime rejects that: "Your publish
# directory cannot be the same as the base directory of your site."

[build]
  command = "pnpm turbo build --filter=@moviewatchlist/web"
  # Relative to the base directory (the repo root), not to this file --
  # ".next" alone resolves to /.next and fails.
  publish = "apps/web/.next"

# Declared rather than relying on Netlify's automatic install. On `main` the
# runtime silently never ran -- CI framework detection missed Next.js, and the
# deploy published the build directory as static files: a green build serving a
# 404 with no server handler. Detection should work here (the package directory
# is the Next.js app), but declaring it removes the dependence entirely.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Documentation files contain placeholder env var examples, not real secrets.
  SECRETS_SCAN_OMIT_PATHS = "README.md,CLAUDE.md,.env.example"
